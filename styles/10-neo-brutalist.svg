<svg xmlns="http://www.w3.org/2000/svg" width="189" height="72" viewBox="0 0 189 72">
  <!-- 10 / Neo-brutalist: flat acid field, heavy keylines, hard unblurred offsets -->
  <rect x="3" y="3" width="183" height="66" fill="#FFE600"/>
  <rect x="4.25" y="4.25" width="180.5" height="63.5" fill="none" stroke="#000000" stroke-width="2.5"/>

  <!-- word card: hard offset block, then card -->
  <rect x="14" y="14" width="146" height="35" fill="#000000"/>
  <rect x="10" y="10" width="146" height="35" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="15" y="35.6" font-family="HelveticaNeue-CondensedBlack, Helvetica Neue" font-size="22.5" letter-spacing="0.5" fill="#000000">TAX RECEIPTS</text>

  <!-- sticker tag (year), knocked off-axis, with its own hard offset -->
  <g transform="rotate(-6 166 16)">
    <rect x="153.5" y="11.5" width="28" height="12" fill="#000000"/>
    <rect x="151.5" y="9.5" width="28" height="12" fill="#FF4F9A" stroke="#000000" stroke-width="1.5"/>
    <text x="165.5" y="18.3" text-anchor="middle" font-family="HelveticaNeue-CondensedBlack, Helvetica Neue" font-size="8" letter-spacing="0.5" fill="#000000">2026</text>
  </g>

  <!-- footer: raw mono spec line (retention / filing rule) + solid arrow block -->
  <text x="10" y="61.4" font-family="Menlo-Bold, Menlo" font-size="5.6" letter-spacing="0.5" fill="#000000">KEEP 7 YEARS / FILE BY MONTH</text>
  <rect x="166" y="33" width="14" height="29" fill="#000000"/>
  <polygon points="170.6,39 175.4,39 175.4,49.5 178.2,49.5 173,56.5 167.8,49.5 170.6,49.5" fill="#FFE600"/>
</svg>
