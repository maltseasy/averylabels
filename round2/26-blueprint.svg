    <text x="44" y="15.7" font-size="5" letter-spacing="0.3">2 3/8" DIA.</text>
    <text x="80.5" y="13.6" font-size="5" letter-spacing="0.6">TITLE</text>
    <text x="130" y="32.2" font-size="14" text-anchor="middle" letter-spacing="0.9">LIGHT BULBS</text>
    <text x="130" y="41.4" font-size="5" text-anchor="middle" letter-spacing="0.5">TYPE A-19 · MEDIUM SCREW BASE</text>
    <text x="80.5" y="53.6" font-size="5" letter-spacing="0.6">SCALE</text>
    <text x="80.5" y="62" font-size="6.5" letter-spacing="0.3">2" = 1'-0"</text>
    <text x="116.5" y="53.6" font-size="5" letter-spacing="0.6">DWG. NO.</text>
    <text x="116.5" y="62" font-size="6.5" letter-spacing="0.4">E-26</text>
    <text x="150.5" y="53.6" font-size="5" letter-spacing="0.6">SHEET</text>
    <text x="150.5" y="62" font-size="6.5" letter-spacing="0.4">26</text>
  </g>
</svg>
