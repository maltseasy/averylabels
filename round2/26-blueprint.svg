      <stop offset="0" stop-color="#27609e"/>
      <stop offset="0.6" stop-color="#1f5391"/>
      <stop offset="1" stop-color="#184379"/>
    </radialGradient>
  </defs>
  <!-- cyanotype ground -->
  <rect x="3" y="3" width="183" height="66" fill="url(#s26-ground)"/>
  <!-- sheet border and title strip -->
  <g fill="none" stroke="#eef4fb" stroke-linecap="square">
    <rect x="6.5" y="6.5" width="176" height="59" stroke-width="1"/>
    <line x1="77" y1="6.5" x2="77" y2="65.5" stroke-width="1"/>
    <line x1="77" y1="47" x2="182.5" y2="47" stroke-width="0.6"/>
    <line x1="113" y1="47" x2="113" y2="65.5" stroke-width="0.6"/>
    <line x1="147" y1="47" x2="147" y2="65.5" stroke-width="0.6"/>
  </g>
  <!-- elevation: A-19 lamp, medium screw base, drawn at 2" = 1'-0" -->
  <g fill="none" stroke="#eef4fb" stroke-linejoin="round" stroke-linecap="round">
    <!-- centre line -->
    <line x1="9.5" y1="33" x2="72" y2="33" stroke-width="0.35" stroke-dasharray="9 1.4 1.6 1.4" stroke-linecap="butt"/>
    <!-- envelope -->
    <path d="M50 26.85 C45 26.85 40.24 25.3 36.41 22.08 A14.25 14.25 0 1 0 36.41 43.92 C40.24 40.7 45 39.15 50 39.15" stroke-width="0.85"/>
    <!-- screw shell -->
    <rect x="50" y="26.85" width="11" height="12.3" stroke-width="0.85"/>
    <g stroke-width="0.45">
      <line x1="51.9" y1="26.85" x2="52.8" y2="39.15"/>
      <line x1="54" y1="26.85" x2="54.9" y2="39.15"/>
      <line x1="56.1" y1="26.85" x2="57" y2="39.15"/>
      <line x1="58.2" y1="26.85" x2="59.1" y2="39.15"/>
    </g>
    <!-- insulator and contact -->
    <path d="M61 28 L64.4 31 L64.4 35 L61 38" stroke-width="0.85"/>
    <path d="M64.4 31.4 L66.25 31.9 L66.25 34.1 L64.4 34.6" stroke-width="0.85"/>
    <!-- stem, lead wires, filament -->
    <g stroke-width="0.4">
      <path d="M50 29.9 L42 30.7 L39 31.6 L39 34.4 L42 35.3 L50 36.1"/>
      <line x1="39" y1="32" x2="26.5" y2="27"/>
      <line x1="39" y1="34" x2="26.5" y2="39"/>
      <polyline points="26.5,27 25.2,28 27.8,29 25.2,30 27.8,31 25.2,32 27.8,33 25.2,34 27.8,35 25.2,36 27.8,37 25.2,38 26.5,39"/>
    </g>
    <!-- dimension: overall length -->
    <g stroke-width="0.35" stroke-linecap="butt">
      <line x1="13" y1="41.5" x2="13" y2="60.5"/>
      <line x1="66.25" y1="36.5" x2="66.25" y2="60.5"/>
      <line x1="13" y1="58" x2="29.5" y2="58"/>
      <line x1="49.5" y1="58" x2="66.25" y2="58"/>
      <!-- leader: diameter -->
      <polyline points="34.4,20.7 38.3,13.9 42.5,13.9"/>
    </g>
  </g>
  <g fill="#eef4fb">
    <polygon points="13,58 16.6,57.1 16.6,58.9"/>
    <polygon points="66.25,58 62.65,57.1 62.65,58.9"/>
    <polygon points="34.4,20.7 35.4,17.2 36.95,18.1"/>
